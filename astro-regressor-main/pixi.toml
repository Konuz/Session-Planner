[workspace]
authors = ["Kacper Kania <kacper@cantina.ai>"]
channels = ["conda-forge"]
name = "astro-regressor"
platforms = ["osx-arm64", "win-64", "linux-64"]
version = "0.1.0"

[tasks]
distance = "python distance.py"
evaluate = "python evaluate.py"
lab = "jupyter lab distance_estimation.ipynb"
execute = "jupyter nbconvert --to notebook --execute --inplace distance_estimation.ipynb"

[dependencies]
astropy = ">=8.0.2,<9"
jupyterlab = ">=4.6.5,<5"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
pandas = ">=3.0.0,<4"
matplotlib-base = ">=3.10.0,<4"
scikit-learn = ">=1.6.1,<2"
pyvo = ">=1.6.0,<2"
requests = ">=2.32.0,<3"
astroquery = ">=0.4.11,<0.5"
tyro = ">=1.0.16,<2"
rich = ">=15.0.0,<16"
loguru = ">=0.7.3,<0.8"

[pypi-dependencies]
gaiadr3-zeropoint = "==0.1.0"
