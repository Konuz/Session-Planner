<!doctype html>
<!-- PROTOTYP do usunięcia: Wszechświat lokalny z płaszczyzną jak na plakacie. Tylko serwer dev (npm run dev), poza npm run build. -->
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTYP · Wszechświat lokalny jak plakat</title>
    <style>
      body { margin: 0; overflow: hidden; background: var(--bg); }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #status { position: fixed; top: 16px; left: 16px; font: 11px var(--mono); color: var(--text-dim); }
      /* Przełącznik wariantów prototypu: celowo inny niż wygląd aplikacji. */
      .proto-switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; background: #fff; color: #000; border-radius: 999px; font: 13px system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5); white-space: nowrap; }
      .proto-switcher input { width: 90px; }
      .proto-switcher #level-note { min-width: 150px; color: #444; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="status">Wczytywanie katalogu…</div>
    <div class="proto-switcher">
      <label>Galaktyki <input type="range" id="level" min="0" step="1" aria-label="Liczba galaktyk" /></label>
      <span id="level-note"></span>
    </div>
    <script type="module" src="/src/prototype/universePoster.ts"></script>
  </body>
</html>
